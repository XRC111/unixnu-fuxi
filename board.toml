schema_version = 2

# Board description of the Xiaomi 13 (fuxi, SM8550), read by the unixnu build driver. Created from UniXNU
# examples/device; the hardware values come from the stock device tree and Android measurements (fuxi_touch_panel_porting.md,
# facts/). Other fuxi ports (mouse233, Kerfand, hanzi123-bilp) are references only.

[board]
name = "fuxi"
soc = "SM8550"
soc_source = "sm8550"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi 13"
kit = "fuxi"

[components]
# The template set, plus the GENI SPI engine and the FTM5 protocol of the touch controller, and the
# SM8550 UFS transport (ShengUfs; its probe levels are default-off, so it touches nothing until the
# native-ufs-probe boot argument asks). ShengUfs's catalog dependencies (VirtioMmioBlock, VerifiedRoot)
# resolve automatically; VirtioMmioBlock is only used by the full root path, not by the probes.
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot", "QcomGeniSpi", "FuxiFtsTouch", "ShengUfs"]

[kernel]
defconfig = "fuxi_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8550.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
# build-fuxi-root-auth.py edits bsd_init.c so a root volume sealed by the owner policy rather than by
# Apple Image4 does not panic at boot. It is an archive step rather than a patch because two other
# board patches already edit that file and a third hunks-based patch would have to be regenerated
# every time they move the surrounding lines (that failed twice in CI).
# The archives the merged configuration links, in build order: corecrypto from source (plain and namespaced), the ARM
# platform and CPU drivers, SoftwareAES with its bindings (the arch fragment sets CONFIG_XNU_NATIVE_AES), libpthread, the
# mockfs fixture (the OS fragment sets CONFIG_XNU_SOURCE_MOCKFS), the PMGR bridge (CONFIG_XNU_SHENG_PMGR: AMFI needs an
# ApplePMGRNub service), ShengHidInput's touch digitizer (force-loaded by fuxi_defconfig; the touch probe starts it), the RAM
# block (CONFIG_XNU_NATIVE_RAM_BLOCK: a RAM disk from the loader as a block device), the touch archive that bsd_init calls into (patches/xnu/fuxi-touch-probe.patch), and the UFS
# transport (CONFIG_XNU_NATIVE_UFS: ShengUfs's NativeUfs, built by its own component recipe). The order
# follows UniXNU-sheng: the policy archive before the driver that references it.
archives = [
  "build-fuxi-root-auth.py",
  "build-fuxi-root-check-call.py",
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-libpthread-kernel.py",
  "build-mockfs-fixture.py",
  "build-fuxi-platform-power.py",
  "build-fuxi-hid-input.py",
  "build-fuxi-ram-block.py",
  "build-fuxi-root-policy.py",
  "component:ShengUfs",
  "build-fuxi-touch.py",
  "build-fuxi-display.py",
  "build-fuxi-root-check.py",
]

[device_tree]
source = "device:dts/fuxi.dts"
include_dirs = ["soc:dts"]

[firmware]
# OddlyLabs/uefi-fuxi, branch fuxi: UniXNU/uefi-sheng (the official Mu-Silicium fork for UniXNU) with the fuxi bring-up
# commits of matejkoo217/uefi-fuxi, whose platform package derives from Silicium's SM8550 nuwa (Xiaomi 13 Pro). The
# layout and lists follow UniXNU-sheng's [firmware]; Resources/Configs/fuxi.toml supplies the firmware base and size.
config = "fuxi"
dsc = "Platforms/Xiaomi/fuxiPkg/fuxi.dsc"
fd = "Build/fuxiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Common/Mu",
            "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI",
            "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/Qualcomm"]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "fuxi"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "fuxi-research"

# The boot image for `fastboot boot` (nothing is written to the device). Measured on hardware in matejkoo217/uefi-fuxi:
# the fuxi ABL's fastboot boot refuses a header v4 image ("Failed to load/authenticate boot image: Invalid Parameter"), so
# this is the v0 container of Resources/Configs/fuxi-legacy.toml; the ABL refuses an ARM64 header that asks for the
# firmware address ("Load Error"), so the shim advertises text offset 0; and the ABL keeps the boot image ramdisk in
# vendor_boot, so the payload rides after the firmware volume, where fuxiPkg's FuxiBootMemoryDxe publishes it.
# No [[bootimg.dtb_node]]: the firmware's FdtBlob already carries /reserved-memory/splash_region.
[bootimg]
payload = "image"

[bootimg.image]
header_version = 0
base = 0x00000000
kernel_offset = 0x00008000
tags_offset = 0x01e00000
pagesize = 4096
text_offset = 0

[userdata]
# The dual-system partition this unit now has (evidence/2026-11-14-dual-system-partition.md): 32 GiB
# carved from the end of Android's userdata by scripts/dual_sys/partition.py. ShengUfs is built to
# match this GPT name (scripts/build-arm-driver.py substitutes the hardcoded "userdata"), and the
# image is written here, never to userdata. Geometry comes from the device GPT, not from a guess.
partition = "unixnu"
first_lba = 53461760
last_lba = 61850367
lba_bytes = 4096
# The target iPadOS 17.7.11 (iPad7,1) IPSW supplies both windows; SystemOS is skipped if absent.
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS", optional = true },
]
[payload]
volume = "FUXIESP"
# 192 MiB again: the owner-signed policy is header-only (a 544-byte envelope; the per-block tables live in
# the root image as OS.vroot and SystemOS.vroot), so the kernel no longer carries 70 MB of digests. The
# full-envelope form took boot.img to 203.6 MiB, and the fuxi ABL refuses any image larger than the 192 MiB
# boot_a partition with "Failed to load/authenticate boot image: Load Error".
size_mib = 192
loader = "firmware"
title = "UniXNU"
panic_screen = true
# -v, serial=3, debug=0x14e and kt_fixed_zones=120 as on UniXNU-sheng and the other SM8550 ports. sheng-pmgr=2 publishes
# the original ApplePMGRNub that AMFI waits for (kits/fuxi/ShengPlatformPower.cpp, as UniXNU-sheng); without it AMFI panics
# with "AMFI: No PMGR?" a few seconds into bsd_init. sheng-smp=1 and armcpu-spi-ipi=1 start the seven secondary cores as on
# UniXNU-sheng, and armcpu-self-ipi=1 lets each of them take IPIs: XNU signals a core only after it has handled one IPI
# (evidence/2026-11-02-first-boot.md). fuxi-touch=4 runs the touch probe up to sensing with the interrupt, fuxi-touch-hid=1
# starts the HID device that turns its contacts into reports (kits/fuxi/FuxiHidProbe.cpp; sheng-touch-hid=1 gives that device
# its digitizer collection), and fuxi-touch-panic=2 panics with the probe's rows after the first lift, so the result can be
# read from the panic screen. Without a touch the boot ends in the root device wait.
# fuxi-display=1 runs the read-only display probe (package/FuxiDisplayProbe.cpp). It reads the frame
# buffer the firmware publishes in the FB_HANDOFF record at the end of the display reserved region,
# which is the device tree cont_splash_region: 0xb8000000 + 0x2b00000, so the record is at
# 0xb8000000 + 0x2b00000 - 0x40. Both numbers come from the live tree (splash_region node) and are
# passed as arguments so the probe does not walk the memory map.
# native-ufs-probe=11 (ShengUfs NativeUfs, CONFIG_XNU_NATIVE_UFS): read-only window check on the unixnu partition. It adopts the controller the
# firmware left running (stops its request list, refuses an outstanding request), wakes the device with START STOP UNIT
# (power condition ACTIVE, the Linux resume path, no user data touched), then per LUN TEST UNIT READY + READ CAPACITY,
# INQUIRY of LUN 0, and a GPT survey of LUN 0 (header CRCs, disk GUID, every non-empty entry among the first 64 with
# name and LBA range). Nothing is written to the storage; the run ends in the probe's panic.
# The touch probe stays off for the UFS bring-up image (fuxi-touch absent): NativeUfs::start runs from the root-device
# personality match during IOFindBSDRoot, which panics before the touch thread's first report could matter, so keeping
# the touch arguments would only add variables. The touch chain is verified separately (evidence/2026-11-13-first-boot.md).
# rd=md0-ramblock names the RAM block disk as a ramdisk root and is not the three-letter "md0" this kernel takes as its
# rooted-ramdisk marker, so bsd_init skips the sealed root check and still walks to the volume root_match_volume_uuid names
# (bsd_init.c; evidence/2026-11-02-first-boot.md, image r3-ramblock).
kernel_args = ["-v", "serial=3", "debug=0x14e", "kt_fixed_zones=120", "sheng-pmgr=2", "sheng-smp=1", "armcpu-spi-ipi=1",
               "armcpu-self-ipi=1", "native-ufs-root=1", "fuxi-display=1",
               "fuxi-display-base=0xb8000000", "fuxi-display-size=0x2b00000",
               "fuxi-root-check=2"]
# The trust cache the payload carries as kernel.macho.trustcache. DarwinBoot's ValidTrustCaches
# (drivers/DarwinBoot/DarwinBootPkg/Driver/DarwinBoot.c) reads a container of version 2 modules, and the IPSW's
# RestoreTrustCache is a version 1 module (uuid cfc8a0d56fb24d6c8b9bd3976ce18057, 267 entries of 22 bytes), so
# scripts/pack-restore-trust.py re-serialises it: same header, same cdhashes, each entry widened to the 24 bytes
# ValidTrustCaches reads (its flag byte is at offset 20). 6432-byte module in an 8-byte table, 6440 bytes in all.
# The restore cdhashes are the ones that sign the restore ramdisk's own /sbin/launchd; the static and System modules
# (scripts/pack-trust-bundle.py, bundle 7416ca4f...) cover the OS volumes instead, and with those in place launchd
# execs and is then killed, so the boot stops at "initproc failed to start" (bsd/kern/kern_exit.c, proc_handle_critical_exit).
trust_cache_sha256 = ["750b5d8ac5f5b52b8fd02d261caf96dd318db0904b3651ca05d9ae4939de488a"]

[payload.adt]
# Supply the board's identity seed through --unique-chip-id.
chip_id = "207"
unique_chip_id = "required"
# Memory DarwinBoot gives XNU, as mouse233's fuxi RAM-root port uses it (verified there on this phone model).
owned_memory_size = "0x130000000"
# The root the RAM block carries: the APFS volume inside the IPSW restore ramdisk. RestoreRamDisk 044-75545-038.dmg in
# iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw is an IM4P whose payload is the whole container (176 MiB, 4096 byte blocks,
# 45056 blocks); its volume superblock carries this UUID, which scripts/unpack-restore-ramdisk.py reads back before the
# image is packed.
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
# The restore ramdisk travels packed (DBRDISK1, scripts/pack-data-ramdisk.py): 176 MiB dense does not fit the 192 MiB
# payload volume next to the prelinked kernel, 131 MiB packed does.
packed_data_ramdisk = true









